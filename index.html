<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="description" content="Nápady měníme v zážitky. Poznejte Studio Forma — kreativní studio pro značky, které chtějí růst.">
  <title>Studio Forma — Nápady, které mají tvar</title>
  <style>
    :root { --paper:#f6f5f1; --ink:#19241e; --muted:#68736c; --green:#c5ef68; --line:#d9ddd6; --heading: 'Aeonik Pro', 'Aeonik', Arial, Helvetica, sans-serif; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper) url('landing_page_desktop.png') center center / cover no-repeat; font-family:Arial, Helvetica, sans-serif; }
    a { color:inherit; text-decoration:none; }
    .wrap { width:min(1450px, calc(100% - 48px)); margin:auto; }
    .site-header { height:82px; display:flex; align-items:center; }
    .site-header img { display:block; width:150px; max-height:54px; object-fit:contain; object-position:left center; }
    header { height:82px; display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; letter-spacing:-.6px; }
    .mark { display:grid; place-items:center; width:31px; height:31px; background:var(--ink); color:var(--green); border-radius:50%; font-family:var(--heading); font-size:20px; }
    nav { display:flex; align-items:center; gap:34px; color:#49554e; font-size:13px; }
    nav a:hover, .text-link:hover { color:#66852b; }
    .nav-cta { padding:12px 17px; border:1px solid var(--ink); border-radius:3px; color:var(--ink); }
    .hero { display:grid; grid-template-columns:1fr; align-items:center; padding:20px 0 80px; min-height:calc(100vh - 82px); }
    .hero > div:first-child { transform:translateY(-13px); }
    .eyebrow { display:flex; align-items:center; gap:9px; margin:0 0 24px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:1.7px; text-transform:uppercase; }
    .eyebrow:before { content:''; width:25px; height:1px; background:#87927f; }
    h1 { max-width:680px; margin:0; font-family:var(--heading); font-weight:500; -webkit-text-stroke:2px currentColor; text-shadow:0 0 .35px currentColor; font-size:clamp(56px, 7.7vw, 98px); letter-spacing:-4.5px; line-height:.98; }
    h1 em { color:inherit; font-style:normal; font-weight:500; }
    .intro { max-width:900px; margin:26px 0 30px; color:var(--ink); font-size:24px; font-weight:500; -webkit-text-stroke:.4px currentColor; line-height:1.7; }
    .underlined { text-decoration:underline; text-underline-offset:3px; }
    .actions { display:inline-flex; flex-direction:column; align-items:stretch; gap:24px; width:min(100%, 480px); margin-top:22px; }
    .button-color-block { display:flex; align-items:center; justify-content:flex-start; gap:14px; width:100%; min-height:64px; padding:14px 22px; background:#DBD4D0; border-radius:20px; color:var(--ink); font-size:22px; line-height:1.4; text-align:left; }
    .notice-icon { display:grid; flex:0 0 26px; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--ink); color:white; font-family:inherit; font-size:16px; font-weight:700; line-height:1; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:18px; min-height:49px; padding:0 150px; background:#282828; color:white; border-radius:999px; font-size:22px; transition:transform .2s, background .2s; }
    .button:hover { background:#383838; }
    .arrow { font-size:18px; line-height:0; }
    .text-link { font-size:13px; color:#4e5a52; }
    .visual { position:relative; height:420px; overflow:hidden; background:#dce6d6; border-radius:3px; }
    .visual:before { content:''; position:absolute; width:310px; height:310px; border-radius:50%; background:#bed476; top:51px; left:50%; transform:translateX(-50%); }
    .visual:after { content:''; position:absolute; width:205px; height:286px; left:50%; bottom:-49px; transform:translateX(-50%) rotate(11deg); border-radius:105px 105px 14px 14px; background:linear-gradient(145deg,#e8a17d,#c97659 65%,#a35d49); box-shadow:inset -22px 0 32px #8d4a3955; }
    .sun { position:absolute; top:37px; right:54px; width:63px; height:63px; border-radius:50%; background:#f3cf87; }
    .leaf { position:absolute; z-index:1; width:112px; height:45px; left:calc(50% - 148px); top:187px; border-radius:100% 0 100% 0; transform:rotate(-30deg); background:#6b8d58; }
    .leaf.two { left:calc(50% + 42px); top:158px; transform:rotate(33deg) scaleX(-1); background:#829d69; }
    .caption { position:absolute; z-index:2; left:20px; bottom:20px; padding:10px 13px; background:var(--paper); border-radius:2px; font-size:11px; color:#556057; letter-spacing:.3px; }
    .proof { display:flex; align-items:center; justify-content:space-between; gap:24px; border-top:1px solid var(--line); padding:24px 0 31px; color:var(--muted); font-size:12px; }
    .proof strong { color:var(--ink); font-size:13px; font-weight:600; }
    .proof-item { display:flex; align-items:center; gap:10px; }
    .dot { width:7px; height:7px; border-radius:50%; background:#8dac5c; }
    .section { padding:93px 0 100px; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:30px; margin-bottom:38px; }
    h2 { margin:0; font-family:var(--heading); font-size:clamp(38px, 5vw, 58px); font-weight:400; letter-spacing:-2px; }
    .section-head p { max-width:340px; margin:0 0 5px; color:var(--muted); font-size:14px; line-height:1.6; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .card { min-height:215px; padding:26px; border:1px solid var(--line); background:#faf9f6; }
    .num { color:#8a978c; font-size:11px; }
    .card h3 { margin:34px 0 10px; font-family:var(--heading); font-size:25px; font-weight:400; }
    .card p { max-width:280px; margin:0; color:var(--muted); font-size:13px; line-height:1.65; }
    footer { padding:27px 0; color:var(--muted); font-size:12px; }
    .footer-inner { display:flex; justify-content:space-between; gap:20px; }
    @media (max-width:760px) {
      body { background-image:url('landing_page_mobil.png'); }
      .wrap { width:min(100% - 36px, 560px); }
      .site-header { height:70px; }
      .site-header img { width:128px; max-height:46px; }
      nav { gap:17px; }
      nav a:not(.nav-cta) { display:none; }
      .hero { grid-template-columns:1fr; padding:60px 0 45px; gap:38px; }
      h1 { letter-spacing:-3px; }
      .visual { height:340px; }
      .visual:before { width:260px; height:260px; }
      .visual:after { height:230px; }
      .proof { display:grid; grid-template-columns:1fr 1fr; }
      .section { padding:68px 0; }
      .section-head { display:block; }
      .section-head p { margin-top:14px; }
      .cards { grid-template-columns:1fr; }
      .card { min-height:185px; }
      .card h3 { margin-top:24px; }
    }
    @media (max-width:420px) { .actions { gap:17px; } .button { padding:0 15px; } .proof { grid-template-columns:1fr; } .footer-inner { flex-direction:column; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <img src="logo_.png" alt="Studio Forma">
    </header>
    <main>
      <section class="hero" id="domu">
        <div>
          <h1>Získejte bonus 1500Kč</h1>
          <p class="intro">Ať už jste doma nebo v zahraničí, působíte lokálně nebo globálně – přecházejte bez problémů mezi zeměmi a měnami. Zaregistrujte se zdarma jedním klepnutím. Musí vám být 18 let nebo více. <span class="underlined">V případě dotazů nás neváhejte kontaktovat</span>.</p>
          <div class="actions">
            <div class="button-color-block"><span class="notice-icon" aria-hidden="true">!</span><span>Nakupte 3× alespoň za 100 Kč</span></div>
            <a class="button" href="mailto:ahoj@studioforma.cz">Začít</a>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
